<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B892D4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8058A0" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <g opacity="0.35" stroke="url(#orbit)" stroke-width="1.2">
    <ellipse cx="620" cy="360" rx="480" ry="180">
      <animateTransform attributeName="transform" type="rotate" from="0 620 360" to="360 620 360" dur="48s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="620" cy="360" rx="360" ry="120">
      <animateTransform attributeName="transform" type="rotate" from="40 620 360" to="400 620 360" dur="36s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="620" cy="360" rx="240" ry="70">
      <animateTransform attributeName="transform" type="rotate" from="-20 620 360" to="340 620 360" dur="26s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  <g fill="#B892D4">
    <circle cx="180" cy="120" r="2.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="90" r="2"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="920" cy="140" r="2.5"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="1050" cy="220" r="2"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="80" r="1.8"><animate attributeName="opacity" values="0.3;1;0.3" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="260" r="2"><animate attributeName="opacity" values="0.25;0.95;0.25" dur="4.2s" repeatCount="indefinite"/></circle>
  </g>
  <path d="M140 520 C 320 480, 480 300, 620 280 S 920 260, 1080 160" stroke="#B892D4" stroke-width="2" stroke-dasharray="8 10" opacity="0.55">
    <animate attributeName="stroke-dashoffset" from="0" to="-180" dur="8s" repeatCount="indefinite"/>
  </path>
  <g>
    <circle cx="620" cy="280" r="8" fill="#8058A0" opacity="0.9"/>
    <circle cx="620" cy="280" r="18" stroke="#B892D4" stroke-width="1.5" opacity="0.5">
      <animate attributeName="r" values="14;26;14" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
